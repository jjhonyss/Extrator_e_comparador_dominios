<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domain Guard - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="dark">
  <main class="login-shell">
    <section class="panel login-card">
      <div class="brand login-brand">
        <span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3.5v5.2c0 4.8-3.2 8.4-7 9.8-3.8-1.4-7-5-7-9.8V6.5L12 3z"/></svg>
        </span>
        <div>
          <strong>Domain Guard</strong>
          <small>Extrator e comparador de domínios</small>
        </div>
      </div>

      <h1 class="login-title">Acesso restrito</h1>
      <p class="login-subtitle">Entre com suas credenciais para continuar.</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" class="login-form">
        <label>
          <span>Usuario</span>
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button login-submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
